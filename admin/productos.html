<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AP Sports - Productos</title>

    <link rel="icon" type="image/png" href="../img/Logo.png">

    <link rel="stylesheet" href="admin.css">

</head>


<body class="auth-checking">


    <!-- MENÚ MÓVIL -->

    <div class="menu-overlay" id="menuOverlay"></div>


    <div class="admin-layout">


        <!-- BARRA LATERAL -->

        <aside class="sidebar">


            <button class="menu-close" id="menuClose">
                ✕
            </button>


            <div class="logo">

                <img src="../img/Logo.png" alt="AP Sports">

            </div>


            <nav>

                <a href="index.html">

                    <span>⌂</span>

                    Inicio

                </a>


                <a href="productos.html" class="active">

                    <span>▣</span>

                    Productos

                </a>


                <a href="estadisticas.html">

                    <span>▥</span>

                    Estadísticas

                </a>


                <a href="#">

                    <span>⚙</span>

                    Configuración

                </a>

            </nav>


            <div class="sidebar-bottom">

                <a href="../index.html">

                    ← Volver a la web

                </a>

            </div>


        </aside>


        <!-- CONTENIDO PRINCIPAL -->

        <main class="main-content">


            <!-- BARRA SUPERIOR -->

            <header class="topbar">


                <button class="menu-toggle" id="menuToggle">

                    ☰

                </button>


                <div class="topbar-title">

                    <h1>
                        Productos
                    </h1>

                    <p>
                        Administrá los productos de AP Sports
                    </p>

                </div>


                <button class="logout-btn">

                    Cerrar sesión

                </button>


            </header>


            <!-- CONTENIDO -->

            <section class="dashboard">


                <div class="quick-actions">


                    <div class="products-header">


                        <h2>
                            Lista de productos
                        </h2>


                        <a
                            href="agregar-producto.html"
                            class="primary-btn"
                        >

                            + Agregar producto

                        </a>


                    </div>


                    <!-- PRODUCTOS DE SUPABASE -->

                    <div class="products-admin">


                        <p>
                            Cargando productos...
                        </p>


                    </div>


                </div>


            </section>


        </main>


    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- SEGURIDAD + MENÚ + LOGOUT -->

    <script src="admin.js"></script>


    <!-- LISTA DE PRODUCTOS -->

    <script src="lista-productos.js"></script>
