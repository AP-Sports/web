<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AP Sports - Acceso</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <div class="login-logo">
                <img src="../img/Logo.png" alt="AP Sports">
            </div>

            <h1>Panel de control</h1>

            <p class="login-subtitle">
                Ingresá para administrar AP Sports
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Ingresar
                </button>


                <p
                    class="login-error"
                    id="loginError"
                ></p>

            </form>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="login.js"></script>

</body>

</html>
