<!-- CONTENIDO -->


<main class="main-content">





<header class="topbar">


<button class="menu-toggle" id="menuToggle">

☰

</button>




<div class="topbar-title">


<h1>

Editar producto

</h1>



<p>

Modificar información del producto

</p>


</div>




<button class="logout-btn">

Cerrar sesión

</button>



</header>







<section class="dashboard">



<div class="quick-actions">



<h2>

Editar producto

</h2>





<form id="editProductForm">





<label>

Nombre

</label>


<input
type="text"
id="nombre"
required
>







<label>

Descripción

</label>



<textarea
id="descripcion"
required
></textarea>







<label>

Imagen del producto

</label>



<label class="upload-image-btn">


📷 Seleccionar imagen nueva



<input

type="file"

id="imagenArchivo"

accept="image/*"

>


</label>




<p id="imagenNombre">

No se seleccionó una nueva imagen

</p>







<label>

Mensaje de WhatsApp

</label>



<textarea
id="mensaje"
required
></textarea>








<label class="checkbox">


<input

type="checkbox"

id="activo"

>


Mostrar producto


</label>







<button

type="submit"

class="primary-btn"

>


Guardar cambios


</button>





</form>




</div>



</section>





</main>




</div>
